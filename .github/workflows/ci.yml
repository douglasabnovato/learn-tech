# CI do learn-tech — roda só scripts que já existem no package.json.
# Observação: package-lock.json está no .gitignore, por isso a instalação usa
# `npm install` (e não `npm ci`). O .npmrc (legacy-peer-deps) é respeitado.
name: CI

on:
  push:
    branches: [main, developer-mvp-2026, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes (contrato de dados)
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Lint
        run: npm run lint
