# CI do learn-tech — roda só scripts que já existem no package.json.
# Instalação pelo package-lock.json com `npm ci` (issue #127): a mesma árvore de dependências em todo run.
# O .npmrc (legacy-peer-deps) é respeitado.
name: CI

on:
  push:
    branches: [main, developer-mvp-2026, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Formatação (npm run format:check = prettier --check)
        run: npm run format:check

      - name: Testes (contrato de dados)
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Orçamento do chunk inicial (npm run orcamento, limite 320 kB)
        run: npm run orcamento
